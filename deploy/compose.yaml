name: agent

services:
  server:
    image: agent-server:${IMAGE_TAG:-local}
    build:
      context: ../server
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?请配置 DATABASE_URL}
      LISTEN_ADDR: :8080
      PLATFORM_HOSTS: ${PLATFORM_HOSTS:?请配置 PLATFORM_HOSTS}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      STORAGE_FILESYSTEM_ROOT: /data/objects
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-agent}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}
    extra_hosts:
      - host.docker.internal:host-gateway
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    image: agent-web:${IMAGE_TAG:-local}
    build:
      context: ../react-app
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8088}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
